# /etc/nginx/sites-available/datapprove   (symlink into sites-enabled)
# After first install run:  sudo certbot --nginx -d data.api.mednevo.com --redirect
# Certbot will add the 443/TLS server block and the http->https redirect itself.

# Basic auth for everything except CORS preflight (browsers never send creds on OPTIONS).
map $request_method $datapprove_auth {
    OPTIONS off;
    default "Mednevo data review";
}

upstream datapprove_app {
    server unix:/run/datapprove/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name data.api.mednevo.com;

    client_max_body_size 20m;

    access_log /var/log/nginx/datapprove.access.log;
    error_log  /var/log/nginx/datapprove.error.log;

    auth_basic           $datapprove_auth;
    auth_basic_user_file /etc/nginx/.htpasswd-datapprove;

    # Let's Encrypt HTTP-01 challenge must stay reachable without auth
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass         http://datapprove_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect     off;
    }
}
